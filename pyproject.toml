[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gta6clipper"
version = "0.1.0"
description = "Automatic highlight clipper: long gameplay video in, ready-to-post Shorts and YouTube compilations out."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "yt-dlp>=2025.1.1",
]

[project.optional-dependencies]
# Apple Silicon Macs: fastest local transcription (runs on the GPU via MLX).
mlx = ["mlx-whisper>=0.4"]
# Intel Macs / anything else: CPU transcription.
cpu = ["faster-whisper>=1.0"]
dev = ["pytest>=8"]

[project.scripts]
gta6clip = "gta6clipper.cli:main"

[tool.setuptools]
packages = ["gta6clipper"]

[tool.pytest.ini_options]
testpaths = ["tests"]
